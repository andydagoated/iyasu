<!-- Four Pillars dashboard: pillars -> ideas -> goals. Completed goals build the pillar. Works as a Claude artifact (window.storage) or self-hosted (localStorage). -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,500;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#E8E5DE; --surface:#FBFAF7; --surface-2:#F1EEE8;
    --ink:#241E18; --muted:#7A736A; --line:#D9D4CB;
    --wisdom:#2F5C8A; --love:#B23A54; --service:#2E7D5B; --sacrifice:#B26A24;
    --soon:#B26A24; --late:#C0392B; --quiet:#B4ADA2;
    --shadow:0 1px 2px rgba(36,30,24,.05),0 10px 30px rgba(36,30,24,.06);
    --disp:"Bricolage Grotesque",system-ui,sans-serif;
    --body:"Inter",system-ui,sans-serif;
    --serif:"Newsreader",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;padding:0 0 64px}
  .wrap{max-width:1060px;margin:0 auto;padding:0 18px}

  header{padding:30px 0 12px}
  .kicker{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.05}
  .sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:16px}
  .tabs{display:flex;gap:2px;margin-top:20px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:4px;width:fit-content;box-shadow:var(--shadow)}
  .tab{font-family:var(--disp);font-weight:600;font-size:14px;color:var(--muted);background:none;border:0;
    padding:8px 16px;border-radius:8px;cursor:pointer}
  .tab.active{background:var(--ink);color:#fff}

  /* colonnade — pillars built from completed goals */
  .colonnade{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:20px 22px 16px}
  .colonnade-h{font-size:12px;color:var(--muted);margin-bottom:16px}
  .shafts{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;align-items:end}
  .shaft{cursor:pointer;text-align:center}
  .stack-wrap{height:132px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .capital{width:64%;height:7px;border-radius:3px 3px 0 0;background:currentColor;opacity:.9;margin-bottom:3px}
  .stack{width:46%;display:flex;flex-direction:column-reverse;gap:2px}
  .brick{background:currentColor;border-radius:2px;opacity:.9;animation:rise .34s ease both}
  .brick:nth-child(even){opacity:.72}
  .plinth{width:78%;height:9px;border-radius:0 0 4px 4px;background:currentColor;opacity:.55;margin-top:3px}
  .empty-plinth{width:46%;height:100%;border:1.5px dashed var(--line);border-radius:3px;min-height:22px}
  .p-name{font-family:var(--disp);font-weight:700;font-size:14px;margin-top:9px;color:var(--ink)}
  .p-meta{font-size:12px;color:var(--muted);margin-top:2px}
  @keyframes rise{from{opacity:0;transform:translateY(7px) scaleY(.35)}to{opacity:.9;transform:none}}

  .view{margin-top:24px}

  /* pillar cards */
  .pillar{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:20px 22px;margin-bottom:16px;border-top:4px solid currentColor}
  .pillar-h{display:flex;align-items:center;gap:10px}
  .pillar-h .name{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--ink)}
  .pillar-h .tally{font-size:12px;color:var(--muted);margin-left:auto}
  .intention textarea{width:100%;border:1px solid transparent;border-radius:8px;padding:8px 10px;margin-top:10px;
    font-family:var(--serif);font-style:italic;font-size:16.5px;line-height:1.45;color:var(--ink);
    background:var(--surface-2);resize:none;overflow:hidden}
  .intention textarea:hover{border-color:var(--line)}
  .intention textarea:focus{outline:2px solid currentColor;border-color:transparent;background:#fff}

  /* reflective layer: principles + questions */
  .grp-label{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
  .ritem{display:flex;align-items:flex-start;gap:8px;margin-bottom:1px}
  .ritem .marker{flex:none;width:6px;height:6px;margin-top:13px;background:currentColor;transform:rotate(45deg);opacity:.8}
  .ritem.q .marker{width:8px;height:8px;margin-top:12px;background:transparent;border:1.5px solid currentColor;border-radius:50%;transform:none}
  .ritem textarea{flex:1;border:1px solid transparent;border-radius:7px;padding:6px 9px;font-family:var(--body);
    font-size:14px;line-height:1.45;color:var(--ink);background:transparent;resize:none;overflow:hidden}
  .ritem textarea:hover{background:var(--surface-2)}
  .ritem textarea:focus{outline:2px solid currentColor;background:#fff}
  .ritem.q textarea{font-family:var(--serif);font-style:italic;font-size:15px}
  .ritem .icon-btn{opacity:.3;margin-top:5px}
  .ritem:hover .icon-btn{opacity:1}
  .radd{border:0;background:none;color:var(--muted);font-family:var(--body);font-size:13px;cursor:pointer;padding:5px 0 0 14px}
  .radd:hover{color:var(--ink);text-decoration:underline}

  /* ideas */
  .idea{margin-top:16px;border-left:3px solid currentColor;padding:2px 0 2px 14px}
  .idea-h{display:flex;align-items:baseline;gap:8px}
  .idea-title{font-family:var(--disp);font-weight:700;font-size:15.5px;color:var(--ink)}
  .idea-prog{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .idea-note{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);margin-top:2px}
  .idea-actions{display:inline-flex;gap:2px;margin-left:4px}

  /* goals */
  .goal{display:flex;align-items:flex-start;gap:10px;padding:7px 0 7px 2px}
  .goal.done{opacity:.55}
  .check{width:18px;height:18px;border:2px solid var(--line);border-radius:6px;flex:none;margin-top:1px;
    cursor:pointer;display:grid;place-items:center;background:var(--surface-2)}
  .check.on{background:currentColor;border-color:currentColor}
  .check svg{width:11px;height:11px;stroke:#fff;stroke-width:3;fill:none;display:none}
  .check.on svg{display:block}
  .goal-body{flex:1;min-width:0}
  .goal-title{font-size:14px;color:var(--ink)}
  .goal.done .goal-title{text-decoration:line-through}
  .goal-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:2px}
  .due{font-size:12px;color:var(--muted)}
  .due.late{color:var(--late);font-weight:600}
  .due.soon{color:var(--soon);font-weight:600}
  .g-notes{font-size:12px;color:var(--muted);margin-top:2px}
  .g-actions{display:flex;gap:2px;flex:none}
  .icon-btn{border:0;background:none;color:var(--quiet);cursor:pointer;font-size:12px;padding:3px 5px;border-radius:6px}
  .icon-btn:hover{background:var(--surface-2);color:var(--ink)}
  .goal-prompt{font-family:var(--serif);font-style:italic;color:var(--soon);font-size:13.5px;margin:4px 0 2px}
  .add-goal{border:0;background:none;color:var(--muted);font-family:var(--body);font-size:13px;cursor:pointer;padding:5px 0;margin-top:2px}
  .add-goal:hover{color:var(--ink);text-decoration:underline}
  .add-idea{border:1px dashed var(--line);background:none;color:var(--muted);font-family:var(--body);font-size:13px;
    padding:8px 14px;border-radius:9px;cursor:pointer;margin-top:16px}
  .add-idea:hover{border-color:currentColor;color:var(--ink)}
  .empty{color:var(--quiet);font-size:13px;font-family:var(--serif);font-style:italic;padding:6px 0}

  /* this week */
  .section-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
  .section-h h2{font-family:var(--disp);font-weight:700;font-size:16px;margin:0}
  .section-h .count{font-size:12px;color:var(--muted)}
  .wk{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border-left:4px solid currentColor}
  .wk.done{opacity:.6}
  .chip{font-family:var(--disp);font-size:11px;font-weight:600;color:#fff;padding:2px 9px;border-radius:20px;background:currentColor}
  .ctx{font-size:12px;color:var(--muted)}

  /* review */
  .balance{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .bcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:15px;box-shadow:var(--shadow);border-top:3px solid currentColor}
  .bcard .bn{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink)}
  .bcard .bnum{font-family:var(--disp);font-weight:800;font-size:26px;margin-top:6px;color:currentColor}
  .bcard .blbl{font-size:11.5px;color:var(--muted)}
  .rcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:18px 20px;box-shadow:var(--shadow);margin-top:14px}
  .rcard h3{font-family:var(--disp);font-size:15px;margin:0 0 8px}
  .prompt{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:14px}
  .prompt input{margin-top:3px}
  .rcard textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-family:var(--serif);
    font-size:15px;line-height:1.5;resize:vertical;min-height:120px;background:var(--surface-2);color:var(--ink)}
  .rcard textarea:focus{outline:2px solid var(--wisdom);outline-offset:1px}
  .saved{font-size:11px;color:var(--quiet);height:14px;margin-top:6px}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(36,30,24,.42);display:none;place-items:center;padding:18px;z-index:20}
  .scrim.on{display:grid}
  .modal{background:var(--surface);border-radius:15px;width:100%;max-width:450px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.3)}
  .modal h3{font-family:var(--disp);margin:0 0 4px;font-size:19px}
  .modal .msub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px;margin-bottom:14px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;
    font-family:var(--body);font-size:14px;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus{outline:2px solid var(--wisdom);outline-offset:1px}
  .modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
  .btn{font-family:var(--disp);font-weight:600;font-size:14px;padding:9px 18px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}

  footer{text-align:center;margin-top:36px;color:var(--quiet);font-size:12px}
  footer button{background:none;border:0;color:var(--quiet);text-decoration:underline;cursor:pointer;font-size:12px}

  /* auth / setup gate */
  .gate{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;padding:22px;z-index:40}
  .gate.on{display:grid}
  .gate-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:30px 28px;width:100%;max-width:400px;text-align:left}
  .gate-card .kicker{margin-bottom:4px}
  .gate-card h2{font-family:var(--disp);font-weight:800;font-size:24px;margin:0 0 6px}
  .gate-sub{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;margin:0 0 18px;line-height:1.45}
  .gate-card input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px 12px;font-family:var(--body);
    font-size:15px;background:#fff;color:var(--ink);margin-bottom:10px}
  .gate-card input:focus{outline:2px solid var(--wisdom);outline-offset:1px}
  .btn.wide{width:100%;justify-content:center;text-align:center;padding:11px;margin-top:2px}
  .gate-msg{font-size:13px;color:var(--muted);min-height:18px;margin:10px 0 6px}
  .linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;font-family:var(--body);padding:2px 0}
  .linkbtn:hover{color:var(--ink)}
  footer #sync{display:block;font-size:12px;color:var(--quiet);margin-bottom:4px}
  footer #acct{font-size:12px;color:var(--muted)}
  footer .foot-actions{margin-top:8px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap}

  @media(max-width:760px){.shafts,.balance{grid-template-columns:repeat(2,1fr);gap:16px}h1{font-size:27px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}.brick{animation:none!important;opacity:.9!important;transform:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="kicker">Live by what it's for</div>
    <h1>The Four Pillars</h1>
    <div class="sub">Wisdom holds the mind. Love holds the people. Service holds the work. Sacrifice holds the cost.</div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="pillars">Pillars</button>
      <button class="tab" data-tab="week">This Week</button>
      <button class="tab" data-tab="review">Weekly Review</button>
    </div>
  </header>

  <div class="colonnade">
    <div class="colonnade-h">Every goal you complete lays another brick. The pillars rise as you live them — and a bare plinth is a pillar waiting on you.</div>
    <div class="shafts" id="shafts"></div>
  </div>

  <div class="view" id="view"></div>
  <footer>
    <span id="sync"></span>
    <span id="acct"></span>
    <div class="foot-actions">
      <button class="linkbtn" id="export">Export backup</button>
      <button class="linkbtn" id="importbtn">Import backup</button>
      <input type="file" id="importfile" accept="application/json" hidden>
      <button class="linkbtn" id="reset">Reset</button>
    </div>
  </footer>
</div>

<div class="gate" id="gate"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>

<script>
const KEY="pillars-dashboard-v2", V1KEY="pillars-dashboard-v1", NEXT7=7, RECENT=3;
const P={wisdom:{name:"Wisdom",color:"var(--wisdom)"},love:{name:"Love",color:"var(--love)"},
  service:{name:"Service",color:"var(--service)"},sacrifice:{name:"Sacrifice",color:"var(--sacrifice)"}};
const ORDER=["wisdom","love","service","sacrifice"];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()+Math.random();

function baseIntentions(){return{
  wisdom:"Choose the long game. Learn deliberately, decide with evidence over ego.",
  love:"Show up, fully present, for the people who are home.",
  service:"Leave students and systems better than I found them.",
  sacrifice:"Pay the near-term cost for the life that's actually worth building."};}

function starter(){
  const g=(title,done,notes="")=>({id:uid(),title,due:null,done,doneAt:done?Date.now()-2*86400000:null,notes});
  return {intentions:baseIntentions(),
    ideas:[{id:uid(),pillar:"wisdom",title:"Learn the history of house music",
      note:"Where it started, and how it got to tech house.",
      goals:[g("Watch a documentary on Chicago house origins",true),
        g("Build a 15-track 'roots of house' study playlist",false),
        g("Write a few sentences on each era in my notes",false)]}],
    principles:{
      wisdom:["Evidence over ego — change my mind when the data says so."],
      love:["Presence over performance."],
      service:["Leave it better than I found it, and measure whether I did."],
      sacrifice:["If it costs me nothing, it isn't really a choice."]},
    questions:{
      wisdom:["Am I learning, or just consuming?"],
      love:["Who needed me this week that I didn't show up for?"],
      service:["Whose growth am I actually serving here — theirs, or my résumé?"],
      sacrifice:["What am I protecting that I should be willing to give up?"]},
    weeklyNotes:"",reviewChecks:{}};
}

// ─── Supabase config: paste your two values here (both are safe to publish) ───
const SUPABASE_URL      = "";  // e.g. https://xxxxxxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = "";  // your anon / publishable key
// (Or leave blank and enter them once in the app's "Connect your sync" screen.)

let STATE=null, activeTab="pillars", saveTmr=null, cloudTmr=null;
let sb=null, session=null;

function cfg(){
  if(SUPABASE_URL&&SUPABASE_ANON_KEY)return{url:SUPABASE_URL,key:SUPABASE_ANON_KEY};
  try{const c=JSON.parse(localStorage.getItem("pillars-cfg"));if(c&&c.url&&c.key)return c;}catch(e){}
  return null;
}
function readLocal(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function cacheLocal(){try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){}}

function normalize(){
  STATE.intentions=STATE.intentions||baseIntentions();
  STATE.ideas=STATE.ideas||[];STATE.reviewChecks=STATE.reviewChecks||{};
  STATE.principles=STATE.principles||{};STATE.questions=STATE.questions||{};
  ORDER.forEach(pk=>{STATE.principles[pk]=STATE.principles[pk]||[];STATE.questions[pk]=STATE.questions[pk]||[];});
}
function migrateFlat(o){
  const s={intentions:o.intentions||baseIntentions(),ideas:[],weeklyNotes:o.weeklyNotes||"",reviewChecks:o.reviewChecks||{}};
  ORDER.forEach(pk=>{const items=(o.items||[]).filter(it=>it.pillar===pk);if(!items.length)return;
    s.ideas.push({id:uid(),pillar:pk,title:"Imported items",note:"",
      goals:items.map(it=>({id:uid(),title:it.title,due:it.due||null,done:it.status==="done",doneAt:it.doneAt||null,notes:it.notes||""}))});});
  return s;
}
function localState(){
  const cur=readLocal(KEY);if(cur)return cur;
  const old=readLocal(V1KEY);if(old)return migrateFlat(old);
  return starter();
}
async function cloudGet(){
  if(!(sb&&session))return null;
  try{const{data,error}=await sb.from("dashboards").select("data").eq("user_id",session.user.id).maybeSingle();
    return error?null:(data?data.data:null);}catch(e){return null;}
}
async function cloudPush(){
  if(!(sb&&session))return false;
  try{const{error}=await sb.from("dashboards").upsert({user_id:session.user.id,data:STATE});
    setSync(error?"offline":"synced");return !error;}catch(e){setSync("offline");return false;}
}
async function loadData(){
  if(sb&&session){
    const cloud=await cloudGet();
    if(cloud&&Object.keys(cloud).length){STATE=cloud;}
    else{STATE=localState();await cloudPush();}   // first sign-in seeds the cloud from this device
    setSync("synced");
  }else{STATE=localState();}
  normalize();cacheLocal();
}
async function save(){
  cacheLocal();
  if(sb&&session){setSync("saving");clearTimeout(cloudTmr);cloudTmr=setTimeout(cloudPush,300);}
}
function saveSoon(){clearTimeout(saveTmr);saveTmr=setTimeout(save,350);}
function setSync(s){const el=document.getElementById("sync");if(!el)return;
  el.textContent={saving:"Saving…",synced:"Synced to your account ✓",offline:"Offline — saved on this device",local:"Saved on this device"}[s]||"";}

// lookups
const ideasOf=pk=>STATE.ideas.filter(i=>i.pillar===pk);
const findIdea=id=>STATE.ideas.find(i=>i.id===id);
function findGoal(gid){for(const i of STATE.ideas){const g=(i.goals||[]).find(x=>x.id===gid);if(g)return{idea:i,goal:g};}return null;}
function pillarBuilt(pk){return ideasOf(pk).reduce((n,i)=>n+(i.goals||[]).filter(g=>g.done).length,0);}
function pillarOpen(pk){return ideasOf(pk).reduce((n,i)=>n+(i.goals||[]).filter(g=>!g.done).length,0);}
function allGoals(){const out=[];STATE.ideas.forEach(i=>(i.goals||[]).forEach(g=>out.push({idea:i,goal:g})));return out;}

// dates
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function parse(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function dBetween(a,b){return Math.round((b-a)/86400000);}
function dSince(ts){if(!ts)return null;return Math.floor((Date.now()-ts)/86400000);}
function esc(s){return(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtDue(s){if(!s)return{text:"",cls:""};
  const diff=dBetween(today(),parse(s));
  const md=parse(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  if(diff<0)return{text:md+" · "+(-diff)+"d late",cls:"late"};
  if(diff===0)return{text:md+" · today",cls:"late"};
  if(diff<=3)return{text:md+" · in "+diff+"d",cls:"soon"};
  return{text:md,cls:""};}

// ---- colonnade ----
function renderColonnade(){
  document.getElementById("shafts").innerHTML=ORDER.map(pk=>{
    const p=P[pk],built=pillarBuilt(pk),open=pillarOpen(pk);
    let stackHtml;
    if(built===0){stackHtml=`<div class="empty-plinth"></div>`;}
    else{
      const H=120,gap=2;
      const bh=Math.max(3,Math.min(18,Math.floor((H-(built-1)*gap)/built)));
      let bricks="";
      for(let k=0;k<built;k++)bricks+=`<div class="brick" style="height:${bh}px;animation-delay:${Math.min(k*0.03,0.5)}s"></div>`;
      stackHtml=`<div class="capital"></div><div class="stack">${bricks}</div>`;
    }
    const meta=built>0?`${built} built${open?` · ${open} to go`:""}`:(open?`${open} goal${open>1?"s":""} waiting`:"Nothing yet");
    return `<div class="shaft" data-pillar="${pk}" style="color:${p.color}">
      <div class="stack-wrap">${stackHtml}</div>
      <div class="plinth"></div>
      <div class="p-name">${p.name}</div>
      <div class="p-meta">${meta}</div>
    </div>`;
  }).join("");
}

// ---- pillars view ----
function goalRow(idea,g){
  const d=fmtDue(g.due);
  return `<div class="goal ${g.done?"done":""}" data-goal="${g.id}">
    <div class="check ${g.done?"on":""}" data-act="toggle" data-goal="${g.id}"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></div>
    <div class="goal-body"><div class="goal-title">${esc(g.title)}</div>
      ${(d.text||g.notes)?`<div class="goal-meta">${d.text?`<span class="due ${d.cls}">${d.text}</span>`:""}${g.notes?`<span class="g-notes">${esc(g.notes)}</span>`:""}</div>`:""}
    </div>
    <div class="g-actions">
      <button class="icon-btn" data-act="mgoal" data-goal="${g.id}">Move</button>
      <button class="icon-btn" data-act="egoal" data-goal="${g.id}">Edit</button>
      <button class="icon-btn" data-act="dgoal" data-goal="${g.id}">✕</button>
    </div></div>`;
}
function ideaBlock(idea){
  const goals=idea.goals||[];
  const done=goals.filter(g=>g.done).length;
  const rows=goals.length?goals.map(g=>goalRow(idea,g)).join("")
    :`<div class="goal-prompt">↳ Now set the goals that get you there.</div>`;
  return `<div class="idea" data-idea="${idea.id}">
    <div class="idea-h"><span class="idea-title">${esc(idea.title)}</span>
      <span class="idea-prog">${done}/${goals.length} built</span>
      <span class="idea-actions">
        <button class="icon-btn" data-act="eidea" data-idea="${idea.id}">Edit</button>
        <button class="icon-btn" data-act="didea" data-idea="${idea.id}">✕</button></span></div>
    ${idea.note?`<div class="idea-note">${esc(idea.note)}</div>`:""}
    ${rows}
    <button class="add-goal" data-act="agoal" data-idea="${idea.id}">+ Add goal</button>
  </div>`;
}
function reflectSection(pk,kind){
  const isQ=kind==="questions";
  const label=isQ?"Questions for self":"Principles";
  const ph=isQ?"a question worth returning to…":"a principle you hold…";
  const noun=isQ?"question":"principle";
  const arr=STATE[kind][pk]||[];
  const items=arr.map((txt,idx)=>`<div class="ritem ${isQ?"q":"pr"}"><span class="marker"></span>
    <textarea data-reflect="${kind}" data-pk="${pk}" data-idx="${idx}" rows="1" placeholder="${ph}">${esc(txt)}</textarea>
    <button class="icon-btn" data-act="rdel" data-reflect="${kind}" data-pk="${pk}" data-idx="${idx}">✕</button></div>`).join("");
  return `<div class="grp-label">${label}</div>${items}
    <button class="radd" data-act="radd" data-reflect="${kind}" data-pk="${pk}">+ Add ${noun}</button>`;
}
function renderPillars(){
  document.getElementById("view").innerHTML=ORDER.map(pk=>{
    const p=P[pk],ideas=ideasOf(pk),built=pillarBuilt(pk),open=pillarOpen(pk);
    const body=ideas.length?ideas.map(ideaBlock).join("")
      :`<div class="empty">No ideas yet — what would living ${p.name} actually look like?</div>`;
    return `<div class="pillar" style="color:${p.color}">
      <div class="pillar-h"><span class="name">${p.name}</span>
        <span class="tally">${ideas.length} idea${ideas.length===1?"":"s"} · ${built} built · ${open} to go</span></div>
      <div class="intention"><textarea data-intent="${pk}" rows="1" placeholder="What does ${p.name} mean for you right now?">${esc(STATE.intentions[pk]||"")}</textarea></div>
      ${reflectSection(pk,"principles")}
      ${reflectSection(pk,"questions")}
      <div class="grp-label">Ideas</div>
      ${body}
      <button class="add-idea" data-act="aidea" data-pillar="${pk}">+ Add idea to ${p.name}</button>
    </div>`;
  }).join("");
  document.querySelectorAll("textarea[data-intent]").forEach(ta=>{autosize(ta);
    ta.addEventListener("input",()=>{autosize(ta);STATE.intentions[ta.dataset.intent]=ta.value;saveSoon();});});
  document.querySelectorAll("textarea[data-reflect]").forEach(ta=>{autosize(ta);
    ta.addEventListener("input",()=>{autosize(ta);const k=ta.dataset.reflect,pk=ta.dataset.pk,idx=+ta.dataset.idx;
      if(STATE[k]&&STATE[k][pk])STATE[k][pk][idx]=ta.value;saveSoon();});});
}
function autosize(ta){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";}

// ---- this week ----
function renderWeek(){
  const all=allGoals();
  const open=all.filter(x=>!x.goal.done);
  const overdue=open.filter(x=>x.goal.due&&dBetween(today(),parse(x.goal.due))<0).sort((a,b)=>a.goal.due<b.goal.due?-1:1);
  const soon=open.filter(x=>x.goal.due&&dBetween(today(),parse(x.goal.due))>=0&&dBetween(today(),parse(x.goal.due))<=NEXT7).sort((a,b)=>a.goal.due<b.goal.due?-1:1);
  const noDate=open.filter(x=>!x.goal.due);
  const recent=all.filter(x=>x.goal.done&&dSince(x.goal.doneAt)!==null&&dSince(x.goal.doneAt)<=RECENT).sort((a,b)=>b.goal.doneAt-a.goal.doneAt);
  const row=x=>{const p=P[x.idea.pillar],d=fmtDue(x.goal.due);
    return `<div class="wk ${x.goal.done?"done":""}" style="color:${p.color}">
      <div class="check ${x.goal.done?"on":""}" data-act="toggle" data-goal="${x.goal.id}"><svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6"/></svg></div>
      <div class="goal-body"><div class="goal-title">${esc(x.goal.title)}</div>
        <div class="goal-meta"><span class="chip">${p.name}</span><span class="ctx">${esc(x.idea.title)}</span>${d.text?`<span class="due ${d.cls}">${d.text}</span>`:""}</div></div></div>`;};
  const block=(t,arr,note)=>arr.length
    ?`<div class="section-h"><h2>${t}</h2><span class="count">${arr.length}</span></div>${arr.map(row).join("")}`
    :(note?`<div class="section-h"><h2>${t}</h2></div><div class="empty">${note}</div>`:"");
  document.getElementById("view").innerHTML=
    block("⚠ Overdue",overdue,"")+
    block("Due in the next 7 days",soon,"Nothing dated this week.")+
    block("No date yet",noDate,"")+
    block("Recently completed",recent,"");
}

// ---- review ----
const PROMPTS=["Which pillar rose the most this week?","Which one stayed a bare plinth — and is that okay?",
  "Did any goal slip past its date?","What's one small goal for the pillar I'm neglecting most?"];
function renderReview(){
  const cards=ORDER.map(pk=>{const p=P[pk];
    return `<div class="bcard" style="color:${p.color}"><div class="bn">${p.name}</div>
      <div class="bnum">${pillarBuilt(pk)}</div><div class="blbl">bricks built</div>
      <div class="blbl" style="margin-top:6px">${pillarOpen(pk)} goal${pillarOpen(pk)===1?"":"s"} open · ${ideasOf(pk).length} idea${ideasOf(pk).length===1?"":"s"}</div></div>`;}).join("");
  const checks=PROMPTS.map((p,i)=>`<label class="prompt"><input type="checkbox" data-chk="${i}" ${STATE.reviewChecks[i]?"checked":""}> <span>${p}</span></label>`).join("");
  document.getElementById("view").innerHTML=`<div class="balance">${cards}</div>
    <div class="rcard"><h3>Sit with it</h3>${checks}</div>
    <div class="rcard"><h3>This week, in your own words</h3>
      <textarea id="notes" placeholder="What did you build? What did you let go? What's next week asking of you?">${esc(STATE.weeklyNotes)}</textarea>
      <div class="saved" id="notes-saved"></div></div>`;
  const ta=document.getElementById("notes");let t;
  ta.addEventListener("input",()=>{STATE.weeklyNotes=ta.value;clearTimeout(t);
    t=setTimeout(async()=>{await save();const s=document.getElementById("notes-saved");s.textContent="saved";setTimeout(()=>s.textContent="",1200);},400);});
  document.querySelectorAll("[data-chk]").forEach(c=>c.addEventListener("change",()=>{STATE.reviewChecks[c.dataset.chk]=c.checked;saveSoon();}));
}

function render(){renderColonnade();
  if(activeTab==="pillars")renderPillars();else if(activeTab==="week")renderWeek();else renderReview();}

// ---- modals ----
const scrim=document.getElementById("scrim"),modal=document.getElementById("modal");
function closeModal(){scrim.classList.remove("on");modal.innerHTML="";}
scrim.addEventListener("click",e=>{if(e.target===scrim)closeModal();});

function ideaModal(pillar,idea){
  const editing=!!idea;
  modal.innerHTML=`<h3>${editing?"Edit idea":"New idea"}</h3>
    <div class="msub">A direction worth pursuing under this pillar.</div>
    <div class="field"><label>The idea</label><input id="i-title" placeholder="e.g. Learn the history of house music"></div>
    <div class="field"><label>Pillar</label><select id="i-pillar">${ORDER.map(k=>`<option value="${k}">${P[k].name}</option>`).join("")}</select></div>
    <div class="field"><label>A line about it (optional)</label><input id="i-note" placeholder="why it matters / what it looks like"></div>
    <div class="modal-actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="save">${editing?"Save":"Create & set goals"}</button></div>`;
  modal.querySelector("#i-title").value=editing?idea.title:"";
  modal.querySelector("#i-pillar").value=editing?idea.pillar:pillar;
  modal.querySelector("#i-note").value=editing&&idea.note?idea.note:"";
  scrim.classList.add("on");modal.querySelector("#i-title").focus();
  modal.querySelector('[data-x="cancel"]').onclick=closeModal;
  modal.querySelector('[data-x="save"]').onclick=async()=>{
    const title=modal.querySelector("#i-title").value.trim();if(!title){modal.querySelector("#i-title").focus();return;}
    const pk=modal.querySelector("#i-pillar").value,note=modal.querySelector("#i-note").value.trim();
    if(editing){idea.title=title;idea.pillar=pk;idea.note=note;await save();closeModal();render();}
    else{const ni={id:uid(),pillar:pk,title,note,goals:[]};STATE.ideas.push(ni);await save();
      closeModal();render();goalModal(ni.id);}   // prompt goals immediately
  };
}
function goalModal(ideaId,goal){
  const idea=findIdea(ideaId);if(!idea)return;const editing=!!goal;
  modal.innerHTML=`<h3>${editing?"Edit goal":"New goal"}</h3>
    <div class="msub">Toward: ${esc(idea.title)}</div>
    <div class="field"><label>The goal</label><input id="g-title" placeholder="a concrete, finishable step"></div>
    <div class="field"><label>Due date (optional)</label><input id="g-due" type="date"></div>
    <div class="field"><label>Notes (optional)</label><input id="g-notes" placeholder="context, links"></div>
    <div class="modal-actions"><button class="btn" data-x="cancel">Cancel</button>
      <button class="btn" data-x="saveadd">Save & add another</button>
      <button class="btn primary" data-x="save">Save</button></div>`;
  modal.querySelector("#g-title").value=editing?goal.title:"";
  modal.querySelector("#g-due").value=editing&&goal.due?goal.due:"";
  modal.querySelector("#g-notes").value=editing&&goal.notes?goal.notes:"";
  scrim.classList.add("on");modal.querySelector("#g-title").focus();
  modal.querySelector('[data-x="cancel"]').onclick=closeModal;
  const commit=async(again)=>{
    const title=modal.querySelector("#g-title").value.trim();if(!title){modal.querySelector("#g-title").focus();return;}
    const due=modal.querySelector("#g-due").value||null,notes=modal.querySelector("#g-notes").value.trim();
    if(editing){goal.title=title;goal.due=due;goal.notes=notes;}
    else idea.goals.push({id:uid(),title,due,notes,done:false,doneAt:null});
    await save();
    if(again){modal.querySelector("#g-title").value="";modal.querySelector("#g-due").value="";modal.querySelector("#g-notes").value="";modal.querySelector("#g-title").focus();render();}
    else{closeModal();render();}
  };
  modal.querySelector('[data-x="save"]').onclick=()=>commit(false);
  modal.querySelector('[data-x="saveadd"]').onclick=()=>commit(true);
}
function moveModal(gid){
  const f=findGoal(gid);if(!f)return;const cur=f.idea;
  const opts=ORDER.map(pk=>{
    const inner=ideasOf(pk).map(i=>`<option value="${i.id}"${i.id===cur.id?" disabled":""}>${esc(i.title)}${i.id===cur.id?" — current":""}</option>`).join("")
      +`<option value="new:${pk}">＋ New idea in ${P[pk].name}</option>`;
    return `<optgroup label="${P[pk].name}">${inner}</optgroup>`;
  }).join("");
  modal.innerHTML=`<h3>Move goal</h3>
    <div class="msub">Now in ${P[cur.pillar].name} › ${esc(cur.title)}</div>
    <div class="field"><label>${esc(f.goal.title)}</label><select id="mv-dest">${opts}</select></div>
    <div class="modal-actions"><button class="btn" data-x="cancel">Cancel</button><button class="btn primary" data-x="save">Move goal</button></div>`;
  scrim.classList.add("on");
  modal.querySelector('[data-x="cancel"]').onclick=closeModal;
  modal.querySelector('[data-x="save"]').onclick=async()=>{
    const val=modal.querySelector("#mv-dest").value;let dest;
    if(val.indexOf("new:")===0){const pk=val.slice(4);
      dest=ideasOf(pk).find(i=>i.title==="Moved goals");
      if(!dest){dest={id:uid(),pillar:pk,title:"Moved goals",note:"",goals:[]};STATE.ideas.push(dest);}}
    else dest=findIdea(val);
    if(!dest||dest.id===cur.id){closeModal();return;}
    cur.goals=cur.goals.filter(x=>x.id!==gid);
    dest.goals.push(f.goal);
    await save();closeModal();render();
  };
}

// ---- events ----
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(!b)return;
  activeTab=b.dataset.tab;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));render();});
document.getElementById("shafts").addEventListener("click",e=>{const s=e.target.closest(".shaft");if(!s)return;
  activeTab="pillars";document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab==="pillars"));
  render();const card=[...document.querySelectorAll(".pillar")][ORDER.indexOf(s.dataset.pillar)];
  if(card)card.scrollIntoView({behavior:"smooth",block:"start"});});

async function toggleGoal(gid){const f=findGoal(gid);if(!f)return;
  f.goal.done=!f.goal.done;f.goal.doneAt=f.goal.done?Date.now():null;await save();render();}

document.getElementById("view").addEventListener("click",e=>{
  const btn=e.target.closest("[data-act]");if(!btn)return;
  const a=btn.dataset.act;
  if(a==="aidea")return ideaModal(btn.dataset.pillar);
  if(a==="agoal")return goalModal(btn.dataset.idea);
  if(a==="eidea")return ideaModal(null,findIdea(btn.dataset.idea));
  if(a==="didea"){const i=findIdea(btn.dataset.idea);
    if(i&&confirm(`Delete "${i.title}" and its goals?`)){STATE.ideas=STATE.ideas.filter(x=>x.id!==i.id);save().then(render);}return;}
  if(a==="radd"){const k=btn.dataset.reflect,pk=btn.dataset.pk;(STATE[k][pk]=STATE[k][pk]||[]).push("");
    save().then(()=>{render();const list=document.querySelectorAll(`textarea[data-reflect="${k}"][data-pk="${pk}"]`);
      const last=list[list.length-1];if(last)last.focus();});return;}
  if(a==="rdel"){const k=btn.dataset.reflect,pk=btn.dataset.pk,idx=+btn.dataset.idx;
    if(STATE[k]&&STATE[k][pk]){STATE[k][pk].splice(idx,1);save().then(render);}return;}
  const gid=btn.dataset.goal;if(!gid)return;
  if(a==="toggle")return toggleGoal(gid);
  if(a==="mgoal")return moveModal(gid);
  const f=findGoal(gid);if(!f)return;
  if(a==="egoal")return goalModal(f.idea.id,f.goal);
  if(a==="dgoal"){if(confirm("Delete this goal?")){f.idea.goals=f.idea.goals.filter(x=>x.id!==gid);save().then(render);}}
});

document.getElementById("reset").onclick=async()=>{
  if(confirm("Reset to a blank slate? Your ideas, goals, intentions and notes will be cleared.")){
    STATE=starter();normalize();await save();activeTab="pillars";
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab==="pillars"));render();}
};

// ---- backup: export / import ----
function exportData(){
  try{const blob=new Blob([JSON.stringify(STATE,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="four-pillars-backup-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
  catch(e){alert("Export failed.");}
}
function importData(file){
  const r=new FileReader();
  r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d||typeof d!=="object")throw 0;
    STATE=d;normalize();await save();render();accountBar();}
    catch(e){alert("That file couldn't be read as a Four Pillars backup.");}};
  r.onerror=()=>alert("Couldn't read the file.");
  r.readAsText(file);
}
document.getElementById("export").onclick=exportData;
document.getElementById("importbtn").onclick=()=>document.getElementById("importfile").click();
document.getElementById("importfile").onchange=e=>{const f=e.target.files[0];if(f)importData(f);e.target.value="";};

// ---- auth / setup gate ----
const gate=document.getElementById("gate");
function showGate(html){gate.innerHTML=`<div class="gate-card">${html}</div>`;gate.classList.add("on");}
function hideGate(){gate.classList.remove("on");gate.innerHTML="";}

function loginScreen(){
  showGate(`<div class="kicker">The Four Pillars</div><h2>Sign in</h2>
    <p class="gate-sub">Enter your email and I'll send a one-tap link. No password to remember.</p>
    <input id="g-email" type="email" placeholder="you@email.com" autocomplete="email">
    <button class="btn primary wide" id="g-send">Email me a sign-in link</button>
    <div class="gate-msg" id="g-msg"></div>
    <button class="linkbtn" id="g-offline">Use this device only, without an account</button>`);
  const email=document.getElementById("g-email");email.focus();
  document.getElementById("g-send").onclick=async()=>{
    const e=email.value.trim();if(!e)return email.focus();
    document.getElementById("g-msg").textContent="Sending…";
    try{const{error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});
      document.getElementById("g-msg").textContent=error?("Couldn't send: "+error.message)
        :"Check your email and tap the link — you can open it right here.";}
    catch(err){document.getElementById("g-msg").textContent="Something went wrong. Check your connection and try again.";}
  };
  document.getElementById("g-offline").onclick=()=>{sb=null;session=null;hideGate();startLocal();};
}
function setupScreen(){
  showGate(`<div class="kicker">The Four Pillars</div><h2>Connect your sync</h2>
    <p class="gate-sub">Paste your Supabase project URL and public (anon) key. They're stored only in this browser and only ever talk to your own Supabase.</p>
    <input id="s-url" placeholder="https://xxxx.supabase.co">
    <input id="s-key" placeholder="anon / publishable key">
    <button class="btn primary wide" id="s-save">Connect</button>
    <div class="gate-msg" id="s-msg"></div>
    <button class="linkbtn" id="s-offline">Skip — use this device only</button>`);
  document.getElementById("s-save").onclick=()=>{
    const url=document.getElementById("s-url").value.trim().replace(/\/+$/,"");
    const key=document.getElementById("s-key").value.trim();
    if(!url||!key)return void(document.getElementById("s-msg").textContent="Both fields are required.");
    if(!window.supabase)return void(document.getElementById("s-msg").textContent="Sync library didn't load — check your connection and reload.");
    try{localStorage.setItem("pillars-cfg",JSON.stringify({url,key}));}catch(e){}
    boot();
  };
  document.getElementById("s-offline").onclick=()=>{hideGate();startLocal();};
}
function accountBar(){
  const el=document.getElementById("acct");if(!el)return;
  if(sb&&session){el.innerHTML=`Signed in as ${esc(session.user.email||"you")} · <button class="linkbtn" id="signout">Sign out</button>`;
    const b=document.getElementById("signout");if(b)b.onclick=()=>sb.auth.signOut();}
  else{el.innerHTML=`Not synced · <button class="linkbtn" id="setupbtn">Set up sync</button>`;
    const b=document.getElementById("setupbtn");if(b)b.onclick=()=>{try{localStorage.removeItem("pillars-cfg");}catch(e){}setupScreen();};}
}
async function startApp(){hideGate();await loadData();render();accountBar();}
async function startLocal(){setSync("local");await loadData();render();accountBar();}

async function boot(){
  const c=cfg();
  if(c&&window.supabase){
    sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
    try{const{data}=await sb.auth.getSession();session=data.session||null;}catch(e){session=null;}
    sb.auth.onAuthStateChange((_evt,s)=>{const had=!!session;session=s||null;
      if(session&&!had)startApp();else if(!session&&had)loginScreen();});
    if(session)startApp();else loginScreen();
  }else if(c&&!window.supabase){setSync("offline");startLocal();}
  else{if(window.supabase)setupScreen();else startLocal();}
}
boot();
</script>
